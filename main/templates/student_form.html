{% extends "base.html" %}

{%block title %} Add Student {%endblock%}

{%block content%}
 
<h2>Student Registration Form</h2>

<form method ="post">
    {%csrf_token%}

    <label>Student Name:</label>
    <input type="text" name="student_name">

     <label>Age:</label>
    <input type="number" name="student_age">

     <label>City:</label>
    <input type="text" name="student_city">

     <label>Email:</label>
    <input type="email" name="student_email">

     <label>Phone:</label>
    <input type="text" name="student_phone">

     <label>Subject:</label>
    <input type="text" name="student_subject">

     <label>Grade:</label>
    <input type="text" name="student_grade">

     <label>Hobby:</label>
    <input type="text" name="student_hobby">

     <label>Address:</label>
    <input type="text" name="student_address">

     <label>Enrollment Year:</label>
    <input type="number" name="enrollment_year">

    <button type="submit">Save student</button>

</form>

{%endblock%}
