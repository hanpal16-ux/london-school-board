
<!-- products.html -->
{% extends "base.html" %}

{% block title %}
products Page
{% endblock %}

{% block content %}

<h1>Product List </h1>
<hr>

{% for product in  all_products%}
<h4>{{product.product_name}}</h4>
<img height="100px" src="{{product.product_image.url}}">
<p>{{product.product_description}}</p>
<p>{{product.product_amount}}</p>

<hr>
{% endfor %}


{% endblock %}
